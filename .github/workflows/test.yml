name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      # Kokoro's markers skip it on Linux, so this is the Gemini-only install. The live-storage test skips without credentials.
      - run: uv run --locked pytest -q
