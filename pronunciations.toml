# Pronunciation dictionary — the single source of truth for how recurring jargon and
# proper nouns are spoken. Every term here is auto-wrapped into Kokoro's input at render
# time (tts.apply_pronunciations), so you can write the word naturally in a script and it
# comes out right, every episode, without hand-annotating.
#
# Format:  term = "phonemes"   (misaki notation — mostly IPA; ˈ = primary stress,
#          ˌ = secondary, ː = long vowel. Capitals are misaki diphthongs: I=aɪ, A=eɪ,
#          O=oʊ, W=aʊ, Y=ɔɪ.) Matching is whole-word and case-insensitive; a term already
#          hand-wrapped in a script as [word](/ipa/) is left alone, so manual tuning wins.
#
# RULE: only add a term Kokoro actually says WRONG. Verify before and after:
#     .venv/bin/python tools/check_pron.py            # phoneme diff per entry
#     .venv/bin/python tools/check_pron.py --render    # hear them in out/pron_check.wav
# An override you didn't ear-check is just a new way to mispronounce something.
#
# Already VERIFIED CORRECT by the model+espeak fallback — do NOT re-add these (checked
# 2026-05-30 with check_pron.py): skua (skew-uh), TTS, API, RSS, SEO, CMS, Plotly,
# matplotlib, DataFrame, markdown, subreddit. The fallback spells acronyms as letters on
# its own, so most don't need help. (If a future stack ships without the espeak fallback,
# OOV terms would break and these would need re-adding — re-run check_pron.py to confirm.)

[pronunciations]
# PyPI: fallback says "pie-pie" (that's PyPy); the convention is "pie-pee-eye". (2026-05-30)
PyPI = "pˌaɪpˌiːˈaɪ"

# Gila (monster): default says "JEE-luh"; the Spanish-derived name is "HEE-luh". (2026-06-04)
Gila = "hˈiːlə"
# tirzepatide: default "TURZ-zip-uh-tide" (wrong vowel + stress); correct "tir-ZEP-uh-tide". (2026-06-04)
tirzepatide = "tˌɜɹzˈɛpətˌaɪd"
# retatrutide: default stresses "TAT"; correct stress is on "TROO" — "reh-tuh-TROO-tide". (2026-06-04)
retatrutide = "ɹˌɛtətɹˈuːtˌaɪd"
# SNAC: an acronym said as a word, "snack" — default spells it out S-N-A-C. (2026-06-04)
SNAC = "snˈæk"

# --- polyphenols episode (2026-06-08) ---
# ORAC: said as a word "OR-ak"; default spells it out O-R-A-C. (2026-06-08)
ORAC = "ˈɔɹæk"
# mitophagy: default "MY-toh-faj-ee" (stress on first); correct "my-TAH-fuh-jee" like autophagy. (2026-06-08)
mitophagy = "mɪtˈɑfəʤi"
# urolithin: default reduces the o and stresses "UR" ("YUR-uh-lithin"); correct "yoo-roh-LITH-in". (2026-06-08)
urolithin = "jˌʊɹoʊlˈɪθɪn"
urolithins = "jˌʊɹoʊlˈɪθɪnz"
# ellagitannins: default mangles to "EL-uh-jit-an-inz"; correct "eh-laj-ih-TAN-inz" (from ellagic). (2026-06-08)
ellagitannins = "ɛlˌæʤɪtˈænɪnz"
# sirtuin: default stresses "TOO"; correct stress is first syllable, "SUR-too-in". (2026-06-08)
sirtuin = "sˈɜɹtuɪn"
# Renaud: French name, silent d; default says "rih-NAWD", correct "ruh-NOH". (2026-06-08)
Renaud = "ɹənˈoʊ"
# acai: default "uh-KY"; correct "ah-sah-EE". (2026-06-08)
acai = "ɑsɑˈi"
# Dipak Das: default "DIP-ak duz"; correct "DEE-pahk Dahs". (2026-06-08)
Dipak = "dˈipɑk"
Das = "dˈɑs"

# --- psychometrics episode (2026-06-12) ---
# Gould: default "ɡˈʊd" drops the L and says "good"; Stephen Jay Gould is "GOOLD". (2026-06-12)
Gould = "ɡˈuld"

# Candidates not yet earning their place — uncomment only after check_pron.py --render
# proves the override beats the default:
# Kokoro = "koʊkˈoʊɹoʊ"   # default kəkˈɔɹO (kuh-KOR-oh) is close-ish; tune if it grates
